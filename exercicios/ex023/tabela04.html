<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo e prática de tabela e mesclagem</title>
    <style>
        table {
            border-collapse: collapse;
            width: 400px;
        }
        th, td {
            border: 1px solid black;
        }
        thead th {
            text-align: center;
        }
        /*
            No th tem o atributo scope, se o dado estiver embaixo na tabela é: scope="col", pq o scope se refere ao dado que está na coluna, se estiver o dado ao lado do th na mesma linha, ai nesse caso na tabela fica: scope="row".
            Diferente da logica do colspan e rowspan, que se expande para colunas ou linhas adjacentes, a lógica do scope é visual, então se o th está em cima de um dado, totalizando uma coluna de dados, é scope="col", se estiver os dados ao lado, é scope="row", se estiver o dados como a coluna Filmes, e embaixo tem colunas agrupadas, scope="colgroup". se estiver linhas agupadas igual no dados Mulheres, é scope="rowgroup", lógica visual"
        */
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Beatriz</td>
                <td>Hulk</td>
                <td>Psicose</td>
                <td>Batman</td>
            </tr>
            <tr>
                <td>Cláudia</td>
                <td>Avatar</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Bruno</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
                <td>Daniel</td>
                <td>Wall-E</td>
                <td>OldBoy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td>Fabiano</td>
                <td>Star Wars</td>
                <td>Enrolados</td>
                <td>Toy Story</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
