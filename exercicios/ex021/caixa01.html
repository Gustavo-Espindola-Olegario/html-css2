<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /* Caixa do tipo box-level*/
            background-color: gray;
            border: 10px solid aquamarine;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            margin: 10px auto 10px auto;
            outline: 5px dashed purple;
            width: 300px;
        }

        a { /* Vaixa do tipo inline-level*/
            border-width: 3px;
            border-style: solid;
            border-color: red;
            padding: 5px;
            margin: 15px;
            outline-width: 10px;
            outline-style: dashed;
            outline-color: pink;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Exemplo de caixa box-level, mas o <a href="#">link ancora é um exemplo de caixa inline-level</a></p>
</body>
</html>
