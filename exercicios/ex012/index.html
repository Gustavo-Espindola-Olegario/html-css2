<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Videos hospedados localmente em seu próprio servidor</p>
    <video src="midia/meu-video.mp4" controls width="600px"></video>
    <p>Video abaixo é mais moderno de colocar vídeo</p>
    <video controls width="600px" poster="imagens/tumb2.jpg" autoplay loop>
        <source src="midia/meu-video.webm" type="video/webm">
        <source src="midia/meu-video.mkv" type="video/matroska">
        <source src="midia/meu-video.ogv" type="video/ogg">
        <source src="midia/meu-video.mp4" type="video/mp4">
        <p>Seu navegador não é compatível com o vídeo</p>
    </video>
    <h1>Inserindo vídeo externo</h1>
    <h2>No Youtube</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/2EKsQKRPfZk?si=dvXFycHF8afl45xl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <h2>No Vimeo</h2>
    <iframe src="https://player.vimeo.com/video/242678698?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="600" height="338" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="NÃO RECOMENDADO (clipe oficial)"></iframe>
</body>
</html>
