<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <!--
	• oninput="calcularIdade()": Um gatilho de evento. Sempre que o usuário digitar ou alterar o valor, ele chama a função JavaScript calcularIdade().
    • <output id="ididade">0</output>: Um elemento específico para exibir resultados de cálculos. Ele começa exibindo o valor 0.

    • <script>: Tag que indica o início do código JavaScript.
    • function calcularIdade() { ... }: Cria uma função chamada calcularIdade.
    • let atual = new Date().getFullYear();: Captura o ano atual do sistema de forma dinâmica (neste caso, 2026).
    • ididade.innerHTML = Number(atual) - Number(idano.value);: Realiza o cálculo e atualiza a tela.
	• idano.value: Pega o ano que o usuário digitou.
	• Number(...): Garante que os valores sejam tratados como números e não como texto.
	• ididade.innerHTML = ...: Substitui o texto de dentro da tag <output> pelo resultado da subtração (Ano Atual - Ano de Nascimento).

    -->
    <h1>Exemplo De Formulário</h1>
    <form action="programa.php" method="get" autocomplete="on">
        <div>
            <fieldset>
                <div>
                    <label for="idano">Em que ano você nasceu?</label>
                    <input type="number" name="ano" id="idano" min="1900" max="2026" oninput="calcularIdade()">
                </div>
                <div>
                    <label for="ididade">Sua idade é</label>
                    <output id="ididade">0</output>
                </div>
            </fieldset>
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    <script>
        function calcularIdade() {
            let atual = new Date().getFullYear();
            ididade.innerHTML = Number(atual) - Number(idano.value);
        }
    </script>
</body>
</html>
