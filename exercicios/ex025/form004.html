<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <!--
    • <fieldset>: Cria uma caixa visual (uma borda) ao redor dos campos relacionados, organizando o formulário semanticamente.
    • <legend>: Define o título ou rótulo dessa caixa de grupo (ex: "Dados pessoais").
    
    • type="email": Valida automaticamente se o usuário digitou uma estrutura válida de e-mail (contendo @ e um domínio).
    • autocomplete="email": Ajuda o navegador a sugerir especificamente os e-mails salvos do usuário.

    • type="tel": Abre o teclado numérico em dispositivos móveis.
    • pattern="^\(\d{2}\)\d{4,5}-\d{4}$": É uma RegEx (Expressão Regular) que força o usuário a digitar o telefone exatamente no formato padrão brasileiro:
	• \(\d{2}\) → Um parêntese, dois dígitos e fecha parêntese: (11)
	• \d{4,5} → Quatro ou cinco dígitos (aceita números antigos de 8 dígitos ou celulares atuais de 9 dígitos): 98765
	• - → Um hífen obrigatório.
	• \d{4}$ → Termina obrigatoriamente com quatro dígitos: 4321
    -->
    <h1>Exemplos de Formulários</h1>
    <form action="programa.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <div>
                <label for="idnome">Nome</label>
                <input type="text" name="nome" id="idnome" minlength="5" maxlength="20" required>
            </div>
            <div>
                <label for="idemail">E-mail</label>
                <input type="email" name="email" id="idemail" autocomplete="email" required>
            </div>
            <div>
                <label for="idtelefone">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel"pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx) xxxx-xxxx">
            </div>
        </fieldset>
        <!-- Estudar mais sobre RegEx -->
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
