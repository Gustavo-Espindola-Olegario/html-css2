<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <style>
        main {
            margin: auto;
            width: 700px;
        }
        div {
            background-color: gainsboro;
            width: 200px;
            height: 200px;
            border: 1px solid black;
            display: inline-block;
            text-align: center;
        }
        div:hover {
            background-color: rgb(255, 255, 73);
        }

    </style>
</head>
<body>
    <main>
    <div>1</div>
    <div>2</div>
    <div>3</div>
    </main>
</body>
</html>
