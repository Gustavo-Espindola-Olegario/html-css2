<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p {
            display: none;
        }

        /* > = children, filho de, em cima, significa q p é filho da div, e é exatamente aonde queremos mexer no p q é filho da div
        hover é uma pseudo classe que pode ser chamada por meio do :
        */
        div:hover {
            color: red;
        }
        div:hover > p {
            display: block;
            background-color: red;
            color: white;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <div> Ehhhhhhhhh
        <p>Texto escondido</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
