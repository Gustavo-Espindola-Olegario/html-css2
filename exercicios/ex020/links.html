<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*  SELETORES PERSONALIZADOS
            #   * id
            .   * class
            :   * pseudo-class
            ::  * pseudo-element
            >   * children
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            text-decoration: none;
            color: purple;
        }

        a:visited {
            color: rgb(202, 5, 5);
        }

        a:hover {
            text-decoration: underline;
        }

        a:active  {
            color: rgb(22, 128, 45)
        }
        a::before {
            content: '\2192';
        }
        a::after {
            content: '\2190';
        }
        a.especial {
            background-color: rgb(255, 68, 68);
            color: white;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/Gustavo-Espindola-Olegario" target="_blank">Meu GitHub</a></li>
        <li><a href="https://www.youtube.com/@gustavoespindola9725" target="_blank" class="especial">Meu Youtube</a></li>
        <li><a href="https://www.linkedin.com/in/gustavo-espindola-olegario-a1a01b1a8/" target="_blank">Meu Linkedin</a></li>
    </ul>
</body>
</html>
