<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente no CSS</title>
    <style>
        * { /* Configurações globais di CSS com * */
            height: 100%;
        }

        body {
            background-image: linear-gradient(to right, #1FE1E9 0.1%, #2B74BE 20%, #021AA1, #3210B8,#5F05E0);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente em CSS</h1>
</body>
</html>
